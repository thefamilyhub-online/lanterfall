services:
  lanternfall:
    build:
      context: ..
      dockerfile: server/Dockerfile
    container_name: lanternfall-server
    restart: unless-stopped
    ports:
      - "7777:7777/udp"
    environment:
      # Which map this server plays: gumdrop_glade or tanglewood
      LANTERNFALL_MAP: gumdrop_glade
    volumes:
      # Accounts and saved progress live in this named volume and survive rebuilds.
      - lanternfall-data:/data

volumes:
  lanternfall-data:
